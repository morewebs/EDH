# EDH bundle patch — one row per thing EDH carries.
#
# The `edh` row is the shell: its module name is the bare package name, so the
# browser half binds to it. It must stay enabled — disabling it would unload the
# EDH control itself.
#
# Every other row is a feature: module names live under `@moreweb/edh/…`, which
# is what the browser half scans for when it aggregates the master switch.
# Turning a feature row off therefore never touches the shell or its UI.
- insert:
    - id: edh
      name: '@moreweb/edh'
      config: {}

    # retry — unlimited retries of a failed model request inside the same turn.
    - id: edh-retry
      name: '@moreweb/edh/retry'
      config: {}

    # edit — edit a user message by forking just before it and seeding the fork's
    # composer. The browser half reads this row's enablement to show the action.
    - id: edh-edit
      name: '@moreweb/edh/edit'
      config: {}

    # export — download the Session as Markdown. The row owns the Host download
    # route; the browser half reads this row's enablement to show the button.
    - id: edh-export
      name: '@moreweb/edh/export'
      config: {}

    # update — update EDH itself from its published repo. The row owns the Host
    # routes that check and apply; the browser half puts the action on EDH's own
    # Plugin Manager page and reloads the new browser half in place.
    - id: edh-update
      name: '@moreweb/edh/update'
      config: {}

    # mcp — the MCP client. EDH keeps its own server list, speaks MCP from this
    # half and registers the tools it discovers with the Harness, so a person
    # adds a server in the UI instead of writing a Loader row into the profile.
    - id: edh-mcp
      name: '@moreweb/edh/mcp'
      config: {}
