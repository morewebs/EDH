# EDH bundle patch — one row per thing EDH carries.
#
# The `edh` row is the shell: its module name is the bare package name, so the
# browser half binds to it. It must stay enabled — disabling it would unload the
# EDH control itself.
#
# Every other row is a feature: module names live under `@moreweb/edh/…`, which
# is what the browser half scans for when it aggregates the master switch.
# Turning a feature row off therefore never touches the shell or its UI.
- insert:
    - id: edh
      name: '@moreweb/edh'
      config: {}

    # retry — unlimited retries of a failed model request inside the same turn.
    - id: edh-retry
      name: '@moreweb/edh/retry'
      config: {}

    # edit — edit a user message by forking just before it and seeding the fork's
    # composer. The browser half reads this row's enablement to show the action.
    - id: edh-edit
      name: '@moreweb/edh/edit'
      config: {}

    # btw — open a side chat: a fork of this conversation, opened at once as its
    # own row in the sidebar. The Host half is empty; the browser half adds the
    # /btw and /side commands and reads this row's enablement before listing them.
    - id: edh-btw
      name: '@moreweb/edh/btw'
      config: {}

    # export — download the Session as Markdown. The row owns the Host download
    # route; the browser half reads this row's enablement to show the button.
    - id: edh-export
      name: '@moreweb/edh/export'
      config: {}

    # update — update EDH itself from its published repo. The row owns the Host
    # routes that check and apply; the browser half puts the action on EDH's own
    # Plugin Manager page and reloads the new browser half in place.
    - id: edh-update
      name: '@moreweb/edh/update'
      config: {}

    # mcp — the MCP client. EDH keeps its own server list, speaks MCP from this
    # half and registers the tools it discovers with the Harness, so a person
    # adds a server in the UI instead of writing a Loader row into the profile.
    - id: edh-mcp
      name: '@moreweb/edh/mcp'
      config: {}

    # remote — the same Web GUI on a phone over the LAN. The row owns a listener
    # of its own on 0.0.0.0 (the harness webserver refuses a wildcard bind), a
    # login page, and the reverse proxy to the loopback GUI; the browser half
    # carries the settings page.
    - id: edh-remote
      name: '@moreweb/edh/remote'
      config: {}

    # usage — token accounting across every stored Session: totals, per model,
    # per local day. The row owns the route and a background scan of the
    # Session logs, cached under the profile; the browser half draws the page.
    - id: edh-usage
      name: '@moreweb/edh/usage'
      config: {}

    # mobile — the web app manifest, and nothing else. The visible half of mobile
    # (metas, stylesheet, manifest link) is injected into the live document by
    # EDH's browser half, which already runs inside the page; this row only
    # serves the manifest a phone needs a URL for.
    - id: edh-mobile
      name: '@moreweb/edh/mobile'
      config: {}

    # notify — the Windows sound files, and nothing else. A browser page cannot
    # read C:\Windows\Media, so this row serves a curated few of the real system
    # WAVs; the browser half owns the settings, the synthesised tones and the
    # watcher that decides when to fire.
    - id: edh-notify
      name: '@moreweb/edh/notify'
      config: {}

    # search — full-text search across every stored Session, for the Ctrl+K
    # palette. A blocking scan is out of the question (761 MB of plaintext, 7.5–15 s
    # a pass), so this row keeps a derived, incrementally-built index under the
    # profile and answers queries from memory; the browser half draws the palette.
    - id: edh-search
      name: '@moreweb/edh/search'
      config: {}
